<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dave KOL 七层词源逻辑原型</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --line:#dfe4ec; --blue:#2f6fed; --bg:#f5f7fb; --ok:#157f3b; --warn:#b45309; --bad:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,"Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
    main { max-width:1180px; margin:32px auto; padding:0 20px 48px; }
    h1 { margin:0 0 8px; font-size:30px; }
    h2 { margin:0 0 14px; font-size:20px; }
    p { line-height:1.65; }
    .intro,.panel { background:white; border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:18px; box-shadow:0 8px 24px rgba(16,24,40,.05); }
    .question { border-left:4px solid var(--blue); padding-left:14px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; }
    button { border:1px solid #cbd3df; border-radius:9px; background:white; color:var(--ink); padding:9px 13px; cursor:pointer; font-weight:650; }
    button.primary { background:var(--blue); color:white; border-color:var(--blue); }
    button:hover { filter:brightness(.97); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
    .stat { border:1px solid var(--line); border-radius:11px; padding:13px; background:#fbfcfe; }
    .stat span { display:block; color:var(--muted); font-size:13px; margin-bottom:5px; }
    .stat strong { font-size:18px; }
    .tag { display:inline-block; padding:3px 8px; border-radius:999px; font-size:12px; font-weight:700; background:#eef4ff; color:#2458bc; margin:2px 4px 2px 0; }
    .tag.ok { background:#e8f7ee; color:var(--ok); }
    .tag.warn { background:#fff3e0; color:var(--warn); }
    .tag.bad { background:#fdecea; color:var(--bad); }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { border-bottom:1px solid var(--line); padding:9px 7px; text-align:left; vertical-align:top; }
    th { color:var(--muted); font-size:12px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .tabs button.active { background:#eaf1ff; color:#2458bc; border-color:#9db9f4; }
    .walkthrough { border:1px solid var(--line); border-radius:12px; padding:16px; }
    .steps { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
    .arrow { color:#98a2b3; }
    .log { max-height:220px; overflow:auto; background:#121826; color:#d7dfed; border-radius:10px; padding:12px; font-family:Consolas,monospace; font-size:12px; }
    .log div { margin-bottom:6px; }
    .muted { color:var(--muted); }
    @media(max-width:700px){ table { display:block; overflow:auto; } }
  </style>
</head>
<body>
<main>
  <section class="intro">
    <h1>Dave KOL 七层词源逻辑原型</h1>
    <p class="question"><strong>这个原型只回答一个问题：</strong>活动按任务选择竞品后，七层词源能否持续生成可解释的发现词，并根据真实候选产出自动保留、冷却和换源，而不把 NYXI 固定到其他产品。</p>
    <p class="muted">这是可丢弃的逻辑原型，不连接飞书、不创建爬虫任务、不发送邮件。点击下面按钮观察完整状态变化。</p>
  </section>

  <section class="panel">
    <h2>自由测试</h2>
    <div class="toolbar">
      <button onclick="loadCase('reuse')">载入 Dave＋引用NYXI</button>
      <button onclick="loadCase('none')">载入 Dave＋不使用竞品</button>
      <button onclick="loadCase('new')">载入 Dave＋新竞品调查</button>
      <button class="primary" onclick="dispatch({type:'GENERATE'})">生成首轮词池</button>
      <button onclick="dispatch({type:'POSITIVE_OUTCOME'})">模拟产出1名合格候选</button>
      <button onclick="dispatch({type:'ZERO_OUTCOME'})">模拟本轮零合格候选</button>
      <button onclick="dispatch({type:'NEXT_CYCLE'})">进入下一轮自动换源</button>
      <button onclick="dispatch({type:'RESET'})">重置</button>
    </div>
  </section>

  <section class="panel">
    <h2>当前业务状态</h2>
    <div id="state"></div>
  </section>

  <section class="panel">
    <h2>引导场景</h2>
    <div class="tabs" id="tabs"></div>
    <div class="walkthrough" id="walkthrough"></div>
  </section>

  <section class="panel">
    <h2>事件记录</h2>
    <div class="log" id="log"></div>
  </section>
</main>

<script>
const KeywordSupplyModel = (() => {
  const DAVE = {
    campaignId: 'launch-20260915-funlab-dave-ys11-5',
    product: 'FUNLAB Dave the Diver Controller',
    languages: ['en','de','es'],
    ipThemes: ['dave the diver','cozy indie games'],
    platforms: ['nintendo switch 2','nintendo switch'],
    categories: ['controller','gamepad'],
    audiences: ['indie gamer','cozy gamer','nintendo fan'],
    formats: ['review','comparison','unboxing'],
  };

  const localized = {
    de: { platform:'nintendo switch 2', category:'controller', format:'test deutsch', ip:'dave the diver deutsch', audience:'indie spiele kanal deutsch' },
    es: { platform:'nintendo switch 2', category:'mando', format:'reseña español', ip:'dave the diver español', audience:'canal juegos indie español' },
  };

  function initial(mode='reuse') {
    const competitor = mode === 'reuse' ? 'NYXI' : mode === 'new' ? 'Competitor B' : '';
    return {
      config: {...DAVE, competitorMode: mode, competitor},
      status: '等待生成', cycle: 0, keywords: [], selected: [],
      sourceState: {
        competitor:{label:'竞品证据', state: mode === 'none' ? 'disabled' : mode === 'new' ? 'pending' : 'ready', zeroRuns:0, eligible:0},
        ip:{label:'IP/主题', state:'ready', zeroRuns:0, eligible:0},
        platform:{label:'平台×品类', state:'ready', zeroRuns:0, eligible:0},
        audience:{label:'用户场景×内容形式', state:'ready', zeroRuns:0, eligible:0},
      },
      logs:[`载入任务：竞品模式=${mode}${competitor ? `，竞品=${competitor}` : ''}`],
    };
  }

  function unique(items) {
    const seen = new Set();
    return items.filter(x => { const key=`${x.language}|${x.keyword}`.toLowerCase(); if(seen.has(key)) return false; seen.add(key); return true; });
  }

  function validKeyword(item) {
    const bad = /(buy|price|discount|official store|amazon deal)/i;
    return item.keyword.length >= 5 && item.keyword.length <= 80 && !bad.test(item.keyword);
  }

  function generate(config) {
    const out = [];
    if (config.competitorMode === 'reuse' && config.competitor) {
      out.push({language:'en', source:'competitor', axes:['竞品','品类','内容形式'], keyword:`${config.competitor} controller review`, reason:'引用历史竞品合作证据'});
      out.push({language:'en', source:'competitor', axes:['竞品','品类','内容形式'], keyword:`${config.competitor} gamepad comparison`, reason:'竞品相似评测达人'});
    }
    // 新调查尚未形成已确认数据前，不把品牌词当成“证据词”；其他来源继续运行。
    out.push(
      {language:'en', source:'ip', axes:['IP/主题','内容形式'], keyword:'dave the diver review', reason:'IP受众'},
      {language:'en', source:'ip', axes:['IP/主题','用户场景'], keyword:'cozy indie game review channel', reason:'相邻高相关受众'},
      {language:'en', source:'platform', axes:['适配平台','品类','内容形式'], keyword:'nintendo switch 2 controller comparison', reason:'平台硬件评测'},
      {language:'en', source:'audience', axes:['用户身份','内容形式'], keyword:'nintendo fan gaming setup review', reason:'平台粉丝场景'},
      {language:'de', source:'platform', axes:['市场本地化','适配平台','品类'], keyword:`${localized.de.platform} ${localized.de.category} ${localized.de.format}`, reason:'德语平台评测'},
      {language:'de', source:'ip', axes:['市场本地化','IP/主题'], keyword:localized.de.ip, reason:'德语IP受众'},
      {language:'es', source:'platform', axes:['市场本地化','适配平台','品类'], keyword:`${localized.es.category} ${localized.es.platform} ${localized.es.format}`, reason:'西语平台评测'},
      {language:'es', source:'ip', axes:['市场本地化','IP/主题'], keyword:`reseña ${localized.es.ip}`, reason:'西语IP受众'},
    );
    return unique(out).filter(validKeyword);
  }

  function chooseFirstProbe(pool, sourceState) {
    const enabled = x => !['disabled','cooling'].includes(sourceState[x.source].state);
    const usable = pool.filter(enabled);
    const pick = (source,language) => usable.find(x=>x.source===source && x.language===language);
    const preferred = [
      pick('competitor','en'), pick('ip','en'),
      pick('platform','de'), pick('platform','es'),
    ].filter(Boolean);
    return unique([...preferred,...usable]).slice(0,4);
  }

  function applyOutcome(state, eligible) {
    if (!state.selected.length) return {...state, logs:[...state.logs,'没有在途探测任务，先生成词池']};
    const touched = [...new Set(state.selected.map(x=>x.source))];
    const nextSources = structuredClone(state.sourceState);
    touched.forEach(source => {
      const s = nextSources[source];
      if (eligible > 0) { s.state='winning'; s.eligible += eligible; s.zeroRuns=0; }
      else { s.zeroRuns += 1; s.state = s.zeroRuns >= 2 ? 'cooling' : 'probing'; }
    });
    return {
      ...state, status: eligible > 0 ? '来源有效，允许扩2个相似词' : touched.some(x=>nextSources[x].state==='cooling') ? '低产来源已冷却，等待换源' : '低产观察，再探测1轮',
      sourceState:nextSources,
      logs:[...state.logs, `回读结果：合格候选=${eligible}；${eligible > 0 ? '保留并扩展来源' : '累计零产出并评估冷却'}`],
    };
  }

  function reduce(state, action) {
    if (action.type === 'RESET') return initial('reuse');
    if (action.type === 'LOAD') return initial(action.mode);
    if (action.type === 'GENERATE') {
      const keywords=generate(state.config), selected=chooseFirstProbe(keywords,state.sourceState);
      return {...state, cycle:state.cycle+1, keywords, selected, status:`已生成${keywords.length}个候选词，首轮选择${selected.length}个探测任务`, logs:[...state.logs,`第${state.cycle+1}轮：生成${keywords.length}词，选择${selected.length}个探测任务`]};
    }
    if (action.type === 'POSITIVE_OUTCOME') return applyOutcome(state,1);
    if (action.type === 'ZERO_OUTCOME') return applyOutcome(state,0);
    if (action.type === 'NEXT_CYCLE') {
      const keywords=generate(state.config), selected=chooseFirstProbe(keywords,state.sourceState);
      return {...state,cycle:state.cycle+1,keywords,selected,status:selected.length?'已自动避开冷却来源并生成下一轮':'所有来源均不可用，停止盲目扩任务',logs:[...state.logs,`进入第${state.cycle+1}轮，自动选择${selected.length}个任务`]};
    }
    return state;
  }
  return {initial,reduce};
})();

let state = KeywordSupplyModel.initial('reuse');
let activeScenario = 0;
const scenarios = [
  {name:'Dave引用NYXI', description:'验证NYXI只来自本任务配置，且竞品词和其他词源并行。', steps:[['载入Dave＋NYXI',{type:'LOAD',mode:'reuse'}],['生成首轮词池',{type:'GENERATE'}],['回读1名合格候选',{type:'POSITIVE_OUTCOME'}]]},
  {name:'不使用竞品', description:'验证没有竞品时仍能从IP、平台、品类、受众和本地化生成充足词池。', steps:[['载入无竞品任务',{type:'LOAD',mode:'none'}],['生成首轮词池',{type:'GENERATE'}]]},
  {name:'新竞品调查', description:'验证新调查未完成时不阻塞其他来源，也不会残留NYXI。', steps:[['载入新竞品任务',{type:'LOAD',mode:'new'}],['生成首轮词池',{type:'GENERATE'}]]},
  {name:'低产自动换源', description:'验证连续两轮零合格候选后自动冷却来源，不继续机械堆任务。', steps:[['载入Dave＋NYXI',{type:'LOAD',mode:'reuse'}],['生成首轮词池',{type:'GENERATE'}],['第一次零产出',{type:'ZERO_OUTCOME'}],['第二次零产出',{type:'ZERO_OUTCOME'}],['下一轮换源',{type:'NEXT_CYCLE'}]]},
];

function dispatch(action){ state=KeywordSupplyModel.reduce(state,action); render(); }
function loadCase(mode){ dispatch({type:'LOAD',mode}); }

function statusTag(value){
  const klass=value==='winning'||value==='ready'?'ok':value==='cooling'||value==='disabled'?'bad':'warn';
  return `<span class="tag ${klass}">${value}</span>`;
}

function render(){
  const cfg=state.config;
  const sourceCards=Object.values(state.sourceState).map(s=>`<div class="stat"><span>${s.label}</span><strong>${statusTag(s.state)}</strong><div class="muted">零产出轮次 ${s.zeroRuns} · 合格候选 ${s.eligible}</div></div>`).join('');
  const rows=state.keywords.map(k=>`<tr><td>${k.language}</td><td>${k.source}</td><td>${k.keyword}</td><td>${k.axes.map(a=>`<span class="tag">${a}</span>`).join('')}</td><td>${k.reason}</td><td>${state.selected.some(x=>x.language===k.language&&x.keyword===k.keyword)?'<span class="tag ok">首轮探测</span>':'候选'}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">尚未生成词池</td></tr>';
  document.getElementById('state').innerHTML=`
    <div class="grid">
      <div class="stat"><span>活动</span><strong>Dave 联名手柄</strong></div>
      <div class="stat"><span>竞品模式</span><strong>${cfg.competitorMode}</strong><div class="muted">${cfg.competitor||'不使用竞品'}</div></div>
      <div class="stat"><span>当前轮次</span><strong>${state.cycle}</strong></div>
      <div class="stat"><span>业务状态</span><strong>${state.status}</strong></div>
    </div><br>
    <div class="grid">${sourceCards}</div><br>
    <table><thead><tr><th>语言</th><th>来源</th><th>关键词</th><th>组合依据</th><th>生成原因</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById('log').innerHTML=state.logs.map((x,i)=>`<div>${String(i+1).padStart(2,'0')}. ${x}</div>`).join('');
  renderScenario();
}

function renderTabs(){
  document.getElementById('tabs').innerHTML=scenarios.map((s,i)=>`<button class="${i===activeScenario?'active':''}" onclick="activeScenario=${i};renderTabs();renderScenario()">${s.name}</button>`).join('');
}

function renderScenario(){
  const s=scenarios[activeScenario];
  document.getElementById('walkthrough').innerHTML=`<p><strong>${s.name}</strong></p><p class="muted">${s.description}</p><div class="steps">${s.steps.map(([label,action],i)=>`${i?'<span class="arrow">→</span>':''}<button onclick='dispatch(${JSON.stringify(action)})'>${label}</button>`).join('')}</div>`;
}
renderTabs(); render();
</script>
</body>
</html>
